name: Materialize lockfile and initial migration

on:
  push:
    branches:
      - feat/production-core-v0.1
    paths:
      - '.github/workflows/materialize-reproducible-build.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-core-v0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency graph
        run: npm install
      - name: Generate initial Prisma migration
        shell: bash
        run: |
          set -euo pipefail
          migration_dir='prisma/migrations/20261011_initial'
          rm -rf "$migration_dir"
          mkdir -p "$migration_dir"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$migration_dir/migration.sql"
          test -s "$migration_dir/migration.sql"
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit reproducible build inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-reproducible-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json prisma/migrations .github/workflows/materialize-reproducible-build.yml
          git commit -m 'chore: add lockfile and initial database migration'
          git push origin HEAD:feat/production-core-v0.1
