name: Materialize lockfile and initial migration

on:
  push:
    branches:
      - feat/production-core-v0.1
    paths:
      - .github/migration-trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-core-v0.1
          fetch-depth: 0
      - name: Check one-time trigger
        id: check
        shell: bash
        run: |
          if [ -f .github/migration-trigger ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install pinned workspace dependencies
        if: steps.check.outputs.run == 'true'
        run: npm install
      - name: Generate initial migration SQL
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prisma/migrations/20261011000000_initial
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261011000000_initial/migration.sql
          test -s prisma/migrations/20261011000000_initial/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit deterministic install and migration artifacts
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/migration-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations .github/migration-trigger
          git commit -m "build: add lockfile and initial Prisma migration"
          git push origin HEAD:feat/production-core-v0.1
