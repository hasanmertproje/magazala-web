name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magazala
          POSTGRES_PASSWORD: magazala
          POSTGRES_DB: magazala
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U magazala -d magazala"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://magazala:magazala@localhost:5432/magazala
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-characters-long
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: magazala
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: "true"
      PREFLIGHT_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma validate --schema=prisma/schema.prisma
      - name: Apply migrations on clean PostgreSQL
        run: npm run prisma:migrate:deploy
      - name: Dashboard analytics tenant isolation and time zone regression
        run: node scripts/dashboard-analytics-check.mjs
      - name: Stock database integrity regression
        run: node scripts/stock-integrity-check.mjs
      - name: Production configuration preflight
        run: npm run preflight:production
      - run: npm run check
      - run: npm run build
      - name: Runtime smoke
        run: bash scripts/runtime-smoke.sh
