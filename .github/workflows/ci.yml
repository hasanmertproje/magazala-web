name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5
      - run: tsc -p packages/core/tsconfig.json --noEmit
      - run: node --test packages/core-tests/core.test.mjs
